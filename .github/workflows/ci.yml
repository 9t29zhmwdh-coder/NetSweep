name: CI

# Baut die WPF-App bei jedem Push / Pull Request auf main
# und stellt die veroeffentlichte EXE als Artefakt bereit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSweep.sln

      - name: Build (Release)
        run: dotnet build NetSweep.sln -c Release --no-restore

      - name: Run Tests with Coverage
        run: dotnet test NetSweep.Tests/NetSweep.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish NetSweep/NetSweep.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetSweep-win-x64
          path: publish/NetSweep.exe
          if-no-files-found: error
