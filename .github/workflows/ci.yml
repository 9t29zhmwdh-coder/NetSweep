name: CI

# Baut die WPF-App bei jedem Push / Pull Request auf main
# und stellt die veroeffentlichte EXE als Artefakt bereit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetSweep.sln

      - name: Build (Release)
        run: dotnet build NetSweep.sln -c Release --no-restore

      - name: Run Tests with Coverage
        run: dotnet test NetSweep.Tests/NetSweep.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish NetSweep/NetSweep.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetSweep-win-x64
          path: publish/NetSweep.exe
          if-no-files-found: error
