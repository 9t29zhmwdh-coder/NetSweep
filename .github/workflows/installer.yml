name: Build Installer

# Laeuft bei jedem Versions-Tag, parallel zu release.yml: baut die
# self-contained EXE, verpackt sie mit Inno Setup zu einem echten Windows-
# Installer (Setup-Assistent, Startmenue-Verknuepfung, Uninstaller-Eintrag)
# und haengt NetSweep-Setup.exe an das Release dieses Tags.
#
# Frueher loeste "release: published" aus. Seit release.yml das Release mit
# GITHUB_TOKEN anlegt, startet GitHub dafuer keine weiteren Workflows mehr,
# und v1.0.5 bis v1.0.10 erschienen ohne Installer. Fuer ein bestehendes
# Release laesst sich der Lauf von Hand mit dem Tag starten.
#
# Nicht signiert: Windows SmartScreen zeigt beim ersten Start eine
# "Unbekannter Herausgeber"-Warnung. Bewusste Entscheidung fuer dieses
# Projekt (siehe CHANGELOG, 2026-07-10) - kein Codesigning-Zertifikat.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.0.10'
        required: true

# Building, including the third-party Inno Setup install, runs read-only;
# only the upload job below may write to the release.
permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSweep.sln

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish NetSweep/NetSweep.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss "/DMyAppVersion=$version"

      - name: Keep installer for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: installer-output/NetSweep-Setup.exe
          if-no-files-found: error

  upload:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release.yml creates the release from the same tag push; wait for it
          # rather than racing it.
          for attempt in $(seq 1 60); do
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "Release $TAG_NAME not there yet, waiting ($attempt/60)"
            sleep 10
          done
          gh release upload "$TAG_NAME" NetSweep-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"
