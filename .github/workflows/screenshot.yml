name: Regenerate Screenshot

# Manuell ausloesbar: baut die App und rendert das Hauptfenster off-screen
# (RenderTargetBitmap) zu docs/screenshot.png (EN) und docs/screenshot.de.png (DE),
# ohne echten Bildschirm-Capture. Die PNGs werden als Artefakt bereitgestellt,
# nicht automatisch committet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSweep.sln

      - name: Build (Release)
        run: dotnet build NetSweep.sln -c Release --no-restore

      - name: Capture screenshots (EN + DE)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "NetSweep/bin/Release" -Filter "NetSweep.exe" -Recurse | Select-Object -First 1

          function Capture($outPath, $lang) {
            Remove-Item $outPath -ErrorAction SilentlyContinue
            & $exe.FullName --screenshot $outPath $lang | Out-Null
            if (-not (Test-Path $outPath)) { throw "Screenshot was not created: $outPath" }
            Write-Host "Captured $lang screenshot: $outPath"
          }

          Capture "$PWD\docs\screenshot.png" "en"
          Start-Sleep -Seconds 2
          Capture "$PWD\docs\screenshot.de.png" "de"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NetSweep-screenshots
          path: |
            docs/screenshot.png
            docs/screenshot.de.png
          if-no-files-found: error
